<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>百人一首 4択ゲーム（桃札20首→10問／復習・読み上げ・和風演出）</title>
  <style>
    :root{
      --ink:#1a1a1a;

      /* 和風ポップ配色 */
      --aka:#e53935;     /* 朱 */
      --beni:#ff4f7b;    /* 紅 */
      --ai:#1e5aa8;      /* 藍 */
      --wakakusa:#2e9b6d;/* 若草 */
      --fuji:#7b4ae2;    /* 藤 */
      --kin:#d6b25e;     /* 金 */
      --washi:#fbf6ea;   /* 和紙 */
      --washi2:#f7efe0;

      --card: rgba(255,255,255,.80);
      --shadow: 0 14px 30px rgba(0,0,0,.14);
      --border: rgba(0,0,0,.08);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      color:var(--ink);
      font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background:
        radial-gradient(900px 520px at 18% 12%, rgba(214,178,94,.22), transparent 58%),
        radial-gradient(760px 520px at 88% 18%, rgba(214,178,94,.15), transparent 60%),
        radial-gradient(900px 700px at 55% 105%, rgba(255,79,123,.10), transparent 60%),
        radial-gradient(800px 600px at 10% 85%, rgba(30,90,168,.10), transparent 60%),
        linear-gradient(180deg, var(--washi), var(--washi2));
      position: relative;
    }

    /* さりげない麻の葉風パターン（薄く） */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.10;
      background:
        linear-gradient(30deg, rgba(0,0,0,.18) 12%, transparent 12.5%, transparent 87%, rgba(0,0,0,.18) 87.5%, rgba(0,0,0,.18)),
        linear-gradient(150deg, rgba(0,0,0,.18) 12%, transparent 12.5%, transparent 87%, rgba(0,0,0,.18) 87.5%, rgba(0,0,0,.18)),
        linear-gradient(90deg, rgba(0,0,0,.18) 2%, transparent 2.5%, transparent 97%, rgba(0,0,0,.18) 97.5%, rgba(0,0,0,.18));
      background-size: 56px 56px;
      mix-blend-mode: multiply;
    }

    .wrap{ max-width: 920px; margin: 0 auto; padding: 18px; }

    /* カード（和紙＋金縁） */
    .card{
      background: var(--card);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(214,178,94,.55);
      position:relative;
      overflow:hidden;
    }
    .card::after{
      content:"";
      position:absolute;
      inset:-2px;
      background:
        radial-gradient(480px 180px at 20% 0%, rgba(214,178,94,.25), transparent 60%),
        radial-gradient(520px 200px at 90% 10%, rgba(214,178,94,.18), transparent 60%);
      pointer-events:none;
    }

    h1{
      font-size: 18px;
      margin: 0 0 10px;
      display:flex;
      align-items:center;
      gap:10px;
      letter-spacing:.02em;
      position:relative;
    }
    h1::before{
      content:"🌸🎴";
      font-size: 20px;
    }
    .meta{ color:#3a3a3a; font-size: 13px; line-height:1.6; position:relative; }

    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; position:relative; }

    button{
      border:0;
      border-radius: 14px;
      padding: 11px 14px;
      cursor:pointer;
      font-weight: 800;
      letter-spacing:.02em;
      transition: transform .08s ease, filter .12s ease, box-shadow .12s ease;
      box-shadow: 0 10px 18px rgba(0,0,0,.12);
      position:relative;
      z-index:1;
    }
    button:active{ transform: translateY(1px) scale(.99); }
    button:disabled{ opacity:.45; cursor:not-allowed; box-shadow:none; }

    #btnStart{ background: linear-gradient(135deg, var(--aka), var(--beni)); color:#fff; }
    #btnNextGame{ background: linear-gradient(135deg, var(--ai), #2f80ed); color:#fff; }
    #btnReview{ background: linear-gradient(135deg, var(--wakakusa), #3cc48a); color:#fff; }
    #btnSpeak, button.secondary{
      background: linear-gradient(135deg, rgba(255,255,255,.92), rgba(255,255,255,.68));
      color:#222;
      border: 1px solid var(--border);
    }

    .pill{
      background: linear-gradient(135deg, rgba(255,255,255,.95), rgba(255,255,255,.65));
      border:1px solid rgba(214,178,94,.45);
      padding: 6px 10px;
      border-radius: 999px;
      font-size:

      pointer-events: none;
      z-index: 9999;
      overflow: hidden;
    }
    .confetti{
      position: absolute;
      width: 10px;
      height: 10px;
      opacity: .95;
      animation: fall 900ms ease-out forwards;
    }
    .confetti.ok{
      background: radial-gradient(circle at 30% 30%, #fff7cc, #d6b25e);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(214,178,94,.9);
    }
    .confetti.ng{
      background: linear-gradient(135deg, #ff9db6, #ff4f7b);
      border-radius: 70% 30% 70% 30%;
    }
    @keyframes fall{
      0%{ transform: translateY(-10px) rotate(0deg) scale(1); opacity: 1; }
      100%{ transform: translateY(120vh) rotate(240deg) scale(.9); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>百人一首 4択ゲーム（桃札20首→10問／復習・読み上げ・和風演出）</h1>
      <div class="row">
        <button id="btnStart">スタート</button>
        <button id="btnNextGame" class="secondary" disabled>次に進む（次の10問）</button>
        <button id="btnReview" class="secondary" disabled>間違えた札だけ復習</button>
        <button id="btnSpeak" class="secondary" disabled>上の句を読み上げ</button>
        <span class="pill" id="voiceStatus">音声：未確認</span>
      </div>
      <p class="meta">
        ・対象：五色百人一首 桃札（赤札・ピンク札）20首／1ゲーム10問<br>
        ・不正解のときだけ「正しい下の句」を読み上げます<br>
        ・ゲーム終了時に「間違えた札一覧」を表示します<br>
      </p>
    </div>

    <div class="card">
      <div class="footer">
        <div class="meta" id="progress">未開始</div>
        <div class="meta" id="score">スコア：0 / 0</div>
      </div>

      <div class="kami" id="kami">「スタート」を押してください。</div>

      <div style="margin-top:12px" id="choices"></div>
      <div id="result"></div>
      <div id="missList" style="margin-top:12px"></div>
    </div>
  </div>

  <div class="effect-layer" id="effectLayer"></div>

<script>
/**
 * 五色百人一首 桃札（赤札・ピンク札）20首
 * format:
 * { id: 1, kami: "上の句", shimo: "下の句" }
 */
const POEMS = [
  { id: 1,  kami: "嘆けとて 月やは物を 思はする",               shimo: "かこち顔なる わが涙かな" },
  { id: 2,  kami: "来ぬ人を 松帆の浦の 夕なぎに",               shimo: "焼くや藻塩の 身もこがれつつ" },
  { id: 3,  kami: "もろともに あはれと思へ 山桜",               shimo: "花よりほかに 知る人もなし" },
  { id: 4,  kami: "音に聞く 高師の浜の あだ波は",               shimo: "かけじや袖の 濡れもこそすれ" },
  { id: 5,  kami: "高砂の 尾の上の桜 咲きにけり",               shimo: "外山の霞 立たずもあらなむ" },
  { id: 6,  kami: "長からむ 心も知らず 黒髪の",                 shimo: "乱れて今朝は 物をこそ思へ" },
  { id: 7,  kami: "かくとだに えやはいぶきの さしも草",         shimo: "さしも知らじな 燃ゆる思ひを" },
  { id: 8,  kami: "有馬山 猪名の笹原 風吹けば",                 shimo: "いでそよ人を 忘れやはする" },
  { id: 9,  kami: "恨みわび 干さぬ袖だに あるものを",           shimo: "恋に朽ちなむ 名こそ惜しけれ" },
  { id: 10, kami: "誰をかも 知る人にせむ 高砂の",               shimo: "松も昔の 友ならなくに" },
  { id: 11, kami: "忍ぶれど 色に出でにけり わが恋は",           shimo: "物や思ふと 人の問ふまで" },
  { id: 12, kami: "風をいたみ 岩打つ波の おのれのみ",           shimo: "砕けて物を 思ふころかな" },
  { id: 13, kami: "立ち別れ 因幡の山の 峰に生ふる",             shimo: "まつとし聞かば いま帰り来む" },
  { id: 14, kami: "吹くからに 秋の草木の しをるれば",           shimo: "むべ山風を 嵐と言ふらむ" },
  { id: 15, kami: "山里は 冬ぞさびしさ まさりける",             shimo: "人目も草も かれぬと思へば" },
  { id: 16, kami: "秋の田の かりほの庵の 苫をあらみ",           shimo: "わが衣手は 露にぬれつつ" },
  { id: 17, kami: "田子の浦に うち出でて見れば 白妙の",         shimo: "富士の高嶺に 雪は降りつつ" },
  { id: 18, kami: "筑波嶺の 峰より落つる 男女川",               shimo: "恋ぞ積もりて 淵となりぬる" },
  { id: 19, kami: "世の中よ 道こそなけれ 思ひ入る",             shimo: "山の奥にも 鹿ぞ鳴くなる" },
  { id: 20, kami: "長らへば またこのごろや 忍ばれむ",           shimo: "憂しと見し世ぞ 今は恋しき" },
];

const GAME_QUESTIONS = 10;
const CHOICES = 4;

let currentSet = [];
let qIndex = 0;
let score = 0;
let locked = false;

let missedIds = new Set();   // 間違えた札（id）
let missedMap = new Map();   // id -> {kami, shimo}（一覧表示用）
let mode = "main";           // "main" or "review"

const $ = (id)=>document.getElementById(id);
const btnStart = $("btnStart");
const btnNextGame = $("btnNextGame");
const btnReview = $("btnReview");
const btnSpeak = $("btnSpeak");
const voiceStatus = $("voiceStatus");
const progress = $("progress");
const scoreBox = $("score");
const kamiBox = $("kami");
const choicesBox = $("choices");
const resultBox = $("result");
const missList = $("missList");
const effectLayer = $("effectLayer");

// ---------- ユーティリティ ----------
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pickRandom(arr, n){
  return shuffle(arr).slice(0, n);
}
function escapeHtml(s){
  return String(s)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#39;");
}

// ---------- 音声読み上げ（Web Speech API） ----------
function speechAvailable(){
  return 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
}
function speak(text){
  if(!speechAvailable()) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP";
  u.rate = 1.0;
  u.pitch = 1.0;
  u.volume = 1.0;
  window.speechSynthesis.speak(u);
}
(function initVoice(){
  voiceStatus.textContent = speechAvailable() ? "音声：対応（端末依存）" : "音声：非対応";
})();

// ===== 和風エフェクト制御 =====
function showEffect(type){
  const count = 18; // 粒の数（多いほど派手）
  for(let i=0;i<count;i++){
    const el = document.createElement("div");
    el.className = `confetti ${type}`;
    el.style.left = (Math.random()*100) + "vw";
    el.style.top = "-20px";
    el.style.animationDelay = (Math.random()*120) + "ms";
    el.style.transform = `rotate(${Math.random()*180}deg)`;
    effectLayer.appendChild(el);
    setTimeout(()=> el.remove(), 1200);
  }
}

// ---------- ゲーム開始 ----------
function newMainGame(){
  mode = "main";
  missedIds = new Set();
  missedMap = new Map();

  currentSet = pickRandom(POEMS, GAME_QUESTIONS);
  qIndex = 0;
  score = 0;

  btnNextGame.disabled = true;
  btnReview.disabled = true;
  btnSpeak.disabled = false;

  renderQuestion();
}

function newReviewGame(){
  mode = "review";
  const missed = POEMS.filter(p => missedIds.has(p.id));

  if(missed.length === 0){
    kamiBox.textContent = "間違えた札がありません。すごい！";
    choicesBox.innerHTML = "";
    resultBox.innerHTML = "";
    missList.innerHTML = "";
    btnReview.disabled = true;
    btnSpeak.disabled = true;
    return;
  }

  currentSet = pickRandom(missed, Math.min(GAME_QUESTIONS, missed.length));
  qIndex = 0;
  score = 0;

  btnNextGame.disabled = true;
  btnReview.disabled = true;
  btnSpeak.disabled = false;

  renderQuestion();
}

// ---------- 出題 ----------
function renderQuestion(){
  locked = false;
  resultBox.innerHTML = "";
  missList.innerHTML = ""; // 出題中は一覧を消す

  if(qIndex >= currentSet.length){
    // 終了画面
    const total = currentSet.length;
    progress.textContent = (mode === "main") ? "ゲーム終了" : "復習 終了";
    scoreBox.textContent = `スコア：${score} / ${total}`;

    if(mode === "main"){
      const missCount = missedIds.size;
      kamiBox.textContent = `おつかれさまでした！ ${score} / ${total} 正解（間違い：${missCount} 首）`;
      choicesBox.innerHTML = "";
      btnNextGame.disabled = false;
      btnReview.disabled = (missCount === 0);
      btnSpeak.disabled = true;

      // ★通常ゲーム終了時のみ「間違い札一覧」表示
      renderMissList();

    } else {
      const remaining = missedIds.size;
      kamiBox.textContent = `復習おつかれさまでした！ ${score} / ${total} 正解（まだ苦手：${remaining} 首）`;
      choicesBox.innerHTML = "";
      btnNextGame.disabled = false;
      btnReview.disabled = (remaining === 0);
      btnSpeak.disabled = true;
      // 復習終了時は一覧表示しない
    }
    return;
  }

  const q = currentSet[qIndex];

  progress.textContent = (mode === "main")
    ? `第 ${qIndex+1} 問 / ${currentSet.length}`
    : `復習 ${qIndex+1} 問 / ${currentSet.length}`;

  scoreBox.textContent = `スコア：${score} / ${qIndex}`;
  kamiBox.textContent = q.kami;

  // 4択（正解1 + 不正解3）
  const wrongPool = POEMS.filter(p => p.id !== q.id);
  const wrongs = pickRandom(wrongPool, CHOICES-1);
  const options = shuffle([q, ...wrongs]).map(p => ({
    id: p.id, text: p.shimo, correct: p.id === q.id
  }));

  choicesBox.innerHTML = options.map((o, idx)=>`
    <button class="choice" data-id="${o.id}" data-correct="${o.correct}">
      ${idx+1}. ${escapeHtml(o.text)}
    </button>
  `).join("");

  [...choicesBox.querySelectorAll("button.choice")].forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(locked) return;
      locked = true;

      const isCorrect = btn.dataset.correct === "true";

      // ★間違い記録（通常ゲーム）
      if(mode === "main"){
        if(!isCorrect){
          missedIds.add(q.id);
          missedMap.set(q.id, { kami: q.kami, shimo: q.shimo });
        }
      }

      // ★復習：正解したら苦手から外す（定着）
      if(mode === "review"){
        if(isCorrect) missedIds.delete(q.id);
        else missedIds.add(q.id);
      }

      if(isCorrect) score++;

      showResult(isCorrect, q.shimo);

      setTimeout(()=>{
        if (speechAvailable()) window.speechSynthesis.cancel(); // 読み上げ残り防止
        qIndex++;
        renderQuestion();
      }, 900);
    });
  });
}

// ---------- 正誤表示（不正解時のみ下の句読み上げ） ----------
function showResult(isCorrect, correctText){
  const cls = isCorrect ? "ok" : "ng";
  const head = isCorrect ? "正解！" : "ちがう…";
  resultBox.innerHTML = `
    <div class="result ${cls}">
      <strong>${head}</strong><br>
      正しい下の句：${escapeHtml(correctText)}
    </div>
  `;

  // ★エフェクト発動
  showEffect(isCorrect ? "ok" : "ng");

  // ★不正解のときだけ、正しい下の句を読み上げる
  if(!isCorrect && speechAvailable()){
    window.speechSynthesis.cancel();
    setTimeout(() => speak(correctText), 200);
  }
}

// ---------- 間違い札一覧（通常ゲーム終了時） ----------
function renderMissList(){
  const missed = [...missedMap.entries()].map(([id, v]) => ({ id, ...v }));

  if(missed.length === 0){
    missList.innerHTML = `<div class="result ok"><strong>全問正解！</strong> 間違えた札はありません。</div>`;
    return;
  }

  const items = missed.map((m, i) => `
    <div style="background:#fff; border:1px solid #e7eaf4; border-radius:12px; padding:10px; margin-top:8px;">
      <div style="font-weight:800; margin-bottom:6px;">${i+1}.（間違い）</div>
      <div style="font-size:15px; line-height:1.5;"><strong>上の句：</strong>${escapeHtml(m.kami)}</div>
      <div style="font-size:15px; line-height:1.5; margin-top:4px;"><strong>下の句：</strong>${escapeHtml(m.shimo)}</div>
    </div>
  `).join("");

  missList.innerHTML = `
    <div class="result ng">
      <strong>今回 間違えた札（${missed.length}首）</strong><br>
      「間違えた札だけ復習」を押すと、ここから出題します。
    </div>
    ${items}
  `;
}

// ---------- ボタン ----------
btnStart.addEventListener("click", ()=>{
  newMainGame();
  if(speechAvailable()) speak("はじめます"); // 初回操作で音声を許可されやすくする
});

btnNextGame.addEventListener("click", ()=>{
  newMainGame();
});

btnReview.addEventListener("click", ()=>{
  newReviewGame();
});

btnSpeak.addEventListener("click", ()=>{
  if(qIndex < currentSet.length){
    speak(currentSet[qIndex].kami);
  }
});
</script>
</body>
</html>
